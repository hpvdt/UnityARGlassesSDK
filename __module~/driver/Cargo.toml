[package]
name = "ar-drivers"
description = "Opensource driver for Rokid, Xreal and some other AR glasses"
version = "0.4.3"
edition = "2021"

authors = ["Alex Badics <admin@stickman.hu>"]
repository = "https://github.com/badicsalex/ar-drivers-rs"
documentation = "https://docs.rs/ar-drivers"
keywords = ["rokid", "ar"]
categories = ["hardware-support"]
license = "MIT"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

#members = [
#    "core",
#    "connection"
#]

[features]
default = ["mad_gaze", "rokid", "xreal", "grawoow"]
grawoow = ["rusb", "tinyjson", "bytemuck"]
mad_gaze = ["serialport"]
xreal = ["hidapi", "tinyjson", "bytemuck"]
rokid = ["rusb"]

[dependencies]
bytemuck = { version = "1.25.0", optional = true }
byteorder = "1.5.0"
nalgebra = { version = "0.34.2", default-features = false, features = ["std"] }
rand = "0.8"
rand_distr = "0.4"
rusb = { version = "0.9.4", optional = true, features = ["vendored"] }
serialport = { version = "4.9.0", optional = true }
tinyjson = { version = "2.5.1", optional = true }
crossterm = "0.29.0"
derive_more = { version = "2", features = ["debug", "from"] }
ratatui = { version = "0.30.2", features = ["scrolling-regions"] }
#imu-fusion = { version = "0.2.1" }
#yakf = { version = "0.1.12" }

[target.'cfg(target_os = "android")'.dependencies]
hidapi = { version = "2.6.6", default-features = false, features = ["linux-static-libusb"], optional = true }

[target.'cfg(all(target_os = "linux", not(target_os = "android")))'.dependencies]
hidapi = { version = "2.6.6", default-features = false, features = ["linux-native-basic-udev"], optional = true }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
hidapi = { version = "2.6.6", optional = true }

[dev-dependencies]
clap = { version = "4.6.1", features = ["derive"] }
serial_test = "3"
test-case = "3"
#opencv = { version = "0.89.0", default-features = false, features = ["highgui", "imgproc", "calib3d"] }

[lib]
crate-type = ["cdylib", "rlib"]
